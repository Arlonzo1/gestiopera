# GestiOpera - Endurecimiento del servicio SSH
# (los archivos de sshd_config.d se leen en orden y gana el primer valor)

# Solo los empleados autorizados (grupo sshusuarios) pueden iniciar sesion
AllowGroups sshusuarios
PermitRootLogin no

# Proteccion contra fuerza bruta (fail2ban complementa esto)
MaxAuthTries 3
MaxSessions 5
MaxStartups 10:30:60
LoginGraceTime 30

# Autenticacion: llaves y contrasenas personales (nunca vacias)
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Reducir superficie de ataque
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no

# Cerrar sesiones abandonadas (10 minutos)
ClientAliveInterval 300
ClientAliveCountMax 2

# Auditoria: registra la huella de la llave usada en cada acceso
LogLevel VERBOSE
Banner /etc/issue.net
