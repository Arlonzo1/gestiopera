services:
  postgres:
    image: postgres:17-alpine
    container_name: billares-pos-postgres
    environment:
      POSTGRES_DB: billares_pos
      POSTGRES_USER: billares_pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billares_pos -d billares_pos"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/BillaresPos.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-billares_pos};Username=${POSTGRES_USER:-billares_pos};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      - api
    ports:
      - "127.0.0.1:5174:80"

volumes:
  postgres_data:




